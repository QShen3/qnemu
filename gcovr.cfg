# Report options used by the CMake `coverage` target.
# Output paths and filters are supplied on the command line by CMake.
html-self-contained = yes
exclude-unreachable-branches = yes
print-summary = yes
# GCC's gcov occasionally reports negative branch counts (GCC bug 68080);
# treat those as a warning instead of failing the coverage report.
gcov-ignore-parse-errors = negative_hits.warn_once_per_file
